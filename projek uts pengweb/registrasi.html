<!--registrasi-->
<section class="registration-page">

        <div class="registration-box">

            <h1>CREATE ACCOUNT</h1>
            <p class="regis-subtitle">
                Join LAVERA and discover your favorite fragrance.
            </p>

            <form action="#" method="post">

                <!-- DATA PELANGGAN -->
                <h2 class="form-title">Personal Information</h2>

                <label for="fullname">Full Name</label>
                <input type="text" id="fullname"
                name="fullname" placeholder="Enter your full name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email"
                name="email" placeholder="Enter your email" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                name="phone" placeholder="Enter your phone number" required>

                <label for="gender">Gender</label>
                <select id="gender" name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="female">Female</option>
                    <option value="male">Male</option>
                </select>

                <label for="password">Password</label>
                <input type="password" id="password"
                name="password" placeholder="Create your password" required>

                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm"
                name="confirm" placeholder="Confirm your password" required>


                <!-- ORDER HERE -->
                <div class="order-section">

                    <h2 class="form-title">ORDER HERE</h2>

                    <p class="order-description">
                        Choose your favorite fragrance and complete your order.
                    </p>

                    <label for="product">Select Product</label>
                    <input type="text" nama="produk" placeholder="Masukkan nama produk" required>
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity"
                    name="quantity" min="1" placeholder="Enter quantity" required>

                    <label for="address">Delivery Address</label>
                    <textarea id="address" name="address"
                    placeholder="Enter your complete address"
                    rows="4" required></textarea>

                    <label for="payment">Payment Method</label>
                    <select id="payment" name="payment" required>
                        <option value="">Choose Payment Method</option>
                        <option value="bank">Bank Transfer</option>
                        <option value="ewallet">E-Wallet</option>
                        <option value="cod">Cash on Delivery</option>
                    </select>

                </div>


                <!-- CHECKBOX -->
                <div class="regis-check">
                    <input type="checkbox" id="agree" required>
                    <label for="agree">
                        I agree to the terms and conditions.
                    </label>
                </div>


                <!-- BUTTON -->
                <button type="submit">REGISTER & PLACE ORDER</button>

            </form>

        </div>

    </section>
</body>
</html>
